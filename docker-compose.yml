version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: shukisha_db
    environment:
      POSTGRES_DB: shukisha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shukisha_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
